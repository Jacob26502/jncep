name: docker

# Build the webhook image on every push to master and push it to GHCR
# (redeploy manually in Portainer with "Re-pull image")

on:
    push:
        branches:
            - master
        paths:
            - "jncep/**"
            - "pyproject.toml"
            - "Dockerfile"
            - "folders.json"
            - "docker-compose.yml"
            - ".github/workflows/docker.yml"
    workflow_dispatch:

jobs:
    image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  # lowercased by the action
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=sha

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
